# Dev stack — `dev_app` API (no Service Bus worker required).
# Usage:
#   cp .env.example .env   # fill AZURE_OPENAI_* (and optional Azure Storage)
#   docker compose up --build -d
#   API: http://localhost:8000/docs
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: lectora-backend:dev
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "0"
      # SQLite inside container (persisted volume below)
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/lectora.db}
    volumes:
      - lectora-data:/app/data
      - ./lectora_backend/pipeline/shared_state:/app/lectora_backend/pipeline/shared_state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  lectora-data:
